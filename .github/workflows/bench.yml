name: Benchmark

on:
  push:
    branches: [master]

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      # fav/.cargo/config.toml sets CXXFLAGS="/EHsc /utf-8" for Windows MSVC.
      # On Linux GCC, these flags are invalid and break the libduckdb-sys bundled build.
      # Clear CXXFLAGS here (force = false in config.toml so this takes priority).
      CXXFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            fav/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('fav/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -j 8
        working-directory: fav

      - name: Run benchmarks
        continue-on-error: true
        env:
          CI: "true"
          FAV: ./fav/target/release/fav
        run: |
          bash benchmarks/suite/run_all.sh --format json > benchmarks/latest.json
          cat benchmarks/latest.json

      - name: Compare with baseline
        continue-on-error: true
        env:
          FAV: ./fav/target/release/fav
        run: |
          $FAV run benchmarks/compare.fav \
            -- --baseline benchmarks/v24.2.0.json \
               --current  benchmarks/latest.json \
               --threshold 5 \
               --emit-md || true

      # ── v54.3.0: パフォーマンスリグレッションスイート CI 統合 ────────────────
      - name: Run perf regression unit tests
        run: cargo test bench_ -- --nocapture
        working-directory: fav

      - name: Regression check against baseline
        continue-on-error: true
        env:
          FAV: ./fav/target/release/fav
        run: |
          $FAV bench --all --compare benchmarks/baseline.json --fail-on-regression || true
